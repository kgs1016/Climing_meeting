<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호비데이</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#0f0e0d; --surface:#1a1917; --surface2:#242220; --line:#33302c;
    --text:#f5f2ee; --muted:#a09a92;
    --accent:#ff5a45; --mint:#7fd8be; --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:0 0 60px;
  }
  .wrap{max-width:460px;margin:0 auto;padding:0 18px}

  header{padding:28px 0 20px}
  .brand{font-size:16px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
  .hello{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-top:10px}
  .evt{font-size:13.5px;color:var(--muted);margin-top:5px}

  .steps{display:flex;gap:6px;margin:18px 0 4px}
  .step{
    flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:7px 2px;
    border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  }
  .step.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.done{color:var(--mint);border-color:rgba(127,216,190,.4)}

  section{padding:22px 0;border-top:1px solid var(--line);margin-top:22px}
  section:first-of-type{border-top:none}
  h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
  .desc{font-size:14px;color:var(--muted);margin-bottom:18px}
  .desc b{color:var(--text)}

  .notice{
    background:rgba(127,216,190,.08);border:1px solid rgba(127,216,190,.3);
    border-radius:12px;padding:13px 15px;font-size:13.5px;margin-bottom:18px;
  }
  .notice b{color:var(--mint)}

  /* 폼 */
  .fld{margin-bottom:17px}
  .fld label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
  .fld .hint{font-size:12px;font-weight:500;color:var(--muted);margin-left:5px}
  .fld input,.fld select{
    width:100%;font-family:inherit;font-size:15px;padding:11px 13px;
    border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);
  }
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
  .fld input::placeholder{color:#5f5b55}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips label{
    font-size:13.5px;font-weight:500;padding:8px 14px;border:1px solid var(--line);
    border-radius:999px;cursor:pointer;color:var(--muted);background:var(--surface);user-select:none;
  }
  .chips input{display:none}
  .chips label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  button{
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;width:100%;
    background:var(--accent);color:#fff;border:none;padding:15px 0;border-radius:13px;
    box-shadow:0 6px 20px rgba(255,90,69,.3);
  }
  button:active{transform:scale(.99)}
  button:disabled{opacity:.45;box-shadow:none;cursor:default}
  button.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none}

  /* 카드 */
  .rcard{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:17px;margin-bottom:14px;
  }
  .rcard .head{
    display:flex;align-items:baseline;gap:8px;padding-bottom:11px;margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .rcard .rno{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.5px}
  .rcard .pname{font-size:17px;font-weight:800}
  .row{display:flex;align-items:flex-start;gap:8px;font-size:14px;
       padding:8px 11px;border-radius:9px;margin-bottom:6px;background:var(--surface2)}
  .row .tag{flex-shrink:0;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;margin-top:2px}
  .row.t1{background:rgba(255,90,69,.1);border:1px solid rgba(255,90,69,.35)}
  .row.t1 .tag{background:var(--accent);color:#fff}
  .row.t2 .tag{background:var(--surface);color:var(--mint);border:1px solid var(--line)}
  .row.t3 .tag{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
  .quote{border-left:3px solid var(--mint);background:var(--surface2);
         padding:9px 12px;border-radius:0 9px 9px 0;margin-top:9px;font-size:14px}
  .quote small{display:block;color:var(--mint);font-size:11.5px;font-weight:700;margin-bottom:2px}
  .seed{margin-top:10px;padding:11px 13px;border-radius:9px;font-size:14px;
        background:rgba(127,216,190,.08);border:1px solid rgba(127,216,190,.3)}
  .seed small{display:block;color:var(--mint);font-size:11.5px;font-weight:800;margin-bottom:2px}
  .mission{margin-top:10px;padding:11px 13px;border-radius:9px;font-size:13.5px;font-weight:600;
           background:rgba(90,140,255,.1);border:1px solid rgba(90,140,255,.3);color:#a9c3ff}
  .empty{color:var(--muted);font-size:14px;padding:14px;text-align:center}

  /* 선택 */
  .pick{
    display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:10px;cursor:pointer;
  }
  .pick input{display:none}
  .pick:has(input:checked){border-color:var(--accent);background:rgba(255,90,69,.09)}
  .pick .box{
    width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;
  }
  .pick:has(input:checked) .box{background:var(--accent);border-color:var(--accent);color:#fff}
  .pick .nm{font-size:16px;font-weight:700}

  .match{
    background:linear-gradient(135deg,rgba(255,90,69,.15),rgba(127,216,190,.12));
    border:1px solid rgba(255,90,69,.4);border-radius:var(--radius);padding:18px;margin-bottom:12px;
  }
  .match .nm{font-size:19px;font-weight:800;margin-bottom:4px}
  .match .ct{font-size:15px;color:var(--mint);font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--mint);color:#07211a;font-size:14px;font-weight:700;
    padding:12px 22px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:9;
  }
  .toast.on{opacity:1}
  footer{padding:30px 0 10px;text-align:center;font-size:12px;color:#5f5b55}
</style>
</head>
<body>
<div class="wrap" id="root">
  <p style="padding:60px 0;text-align:center;color:#a09a92">불러오는 중…</p>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="hobiday-core.js"></script>
<script>
const H = window.HOBIDAY, esc = H.esc;
const token = new URLSearchParams(location.search).get('t');
let sb, state = {};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2200);
}
function screen(html){ document.getElementById('root').innerHTML = html; }

async function rpc(fn, args){
  const {data, error} = await sb.rpc(fn, args);
  if(error){ console.error(fn, error); toast('연결에 문제가 있어요'); return null; }
  return data;
}

/* ─────────── 부팅 ─────────── */
async function boot(){
  if(!window.HOBIDAY_CONFIG || !HOBIDAY_CONFIG.url || HOBIDAY_CONFIG.url.includes('YOUR_')){
    return screen(`<section><h2>설정이 필요해요</h2>
      <p class="desc"><code>config.js</code>에 Supabase 주소와 anon 키를 넣어주세요.
      자세한 건 <b>SETUP.md</b>를 참고하세요.</p></section>`);
  }
  sb = supabase.createClient(HOBIDAY_CONFIG.url, HOBIDAY_CONFIG.anonKey);

  if(!token){
    return screen(`<section><h2>초대 링크로 들어와 주세요</h2>
      <p class="desc">참가 확정 후 받으신 <b>개인 링크</b>로 접속해야 해요.
      링크를 못 받으셨다면 운영자에게 문의해주세요.</p></section>`);
  }

  const d = await rpc('me', {p_token: token});
  if(!d || d.error){
    return screen(`<section><h2>링크를 확인해주세요</h2>
      <p class="desc">유효하지 않은 링크예요. 운영자에게 다시 요청해주세요.</p></section>`);
  }
  state = d;
  render();
}

/* ─────────── 렌더 ─────────── */
async function render(){
  const {me, event} = state;
  const stage = !me.survey_done ? 1 : (event.results_open ? 4 : (event.selection_open ? 3 : 2));

  let body = '';
  if(stage === 1) body = surveyView();
  else {
    body = await cardsView();
    if(event.selection_open) body += await selectView();
    if(event.results_open)   body += await resultView();
  }

  screen(`
    <header>
      <p class="brand">HOBIDAY</p>
      <p class="hello">${esc(me.name)} 님, 반가워요 👋</p>
      <p class="evt">${esc(event.title)}${event.gym ? ' · ' + esc(event.gym) : ''}${event.date ? ' · ' + esc(event.date) : ''}</p>
      <div class="steps">
        ${['설문','카드','선택','결과'].map((s,i)=>{
          const n = i+1;
          return `<div class="step ${n===stage?'on':(n<stage?'done':'')}">${n<stage?'✓ ':''}${s}</div>`;
        }).join('')}
      </div>
    </header>${body}
    <footer>ⓒ HOBIDAY 호비데이</footer>`);
}

/* ── 1. 설문 ── */
function surveyView(){
  const s = state.me.survey || {};
  const fields = H.FIELDS.map(f => {
    const v = s[f.key];
    if(f.type === 'multi'){
      return `<div class="fld"><label>${f.label}<span class="hint">${f.hint||''}</span></label>
        <div class="chips">${f.options.map(o=>{
          const on = Array.isArray(v) && v.includes(o);
          return `<label><input type="checkbox" data-k="${f.key}" value="${esc(o)}" ${on?'checked':''}><span>${esc(o)}</span></label>`;
        }).join('')}</div></div>`;
    }
    if(f.type === 'select'){
      return `<div class="fld"><label>${f.label}</label>
        <select data-k="${f.key}"><option value="">선택해주세요</option>
        ${f.options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select></div>`;
    }
    return `<div class="fld"><label>${f.label}</label>
      <input data-k="${f.key}" value="${esc(v||'')}" placeholder="${esc(f.ph||'')}"></div>`;
  }).join('');

  return `<section>
    <h2>나를 소개해주세요</h2>
    <p class="desc">당일 라운드마다 짝이 바뀌는데, 시작 5분 전에 <b>상대와 나의 공통점 카드</b>가 도착해요.
      이 설문이 그 카드의 재료가 됩니다.</p>
    <div class="notice">📌 여기 쓰신 답변은 <b>당일 만나는 상대에게 공유</b>돼요.
      연락처·나이 같은 개인정보는 공유되지 않아요. 재밌게 써주실수록 대화가 잘 풀립니다!</div>
    ${fields}
    <button onclick="saveSurvey(this)">저장하고 완료하기</button>
  </section>`;
}

async function saveSurvey(btn){
  const survey = {};
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k;
    if(el.type === 'checkbox'){
      if(el.checked) (survey[k] ||= []).push(el.value);
    } else if(el.value) survey[k] = el.value;
  });

  const need = H.FIELDS.filter(f => {
    const v = survey[f.key];
    return !v || (Array.isArray(v) && !v.length);
  });
  if(need.length){
    toast(`${need.length}개 문항이 비어 있어요`);
    return;
  }

  btn.disabled = true; btn.textContent = '저장 중…';
  const r = await rpc('save_survey', {p_token: token, p_survey: survey});
  btn.disabled = false; btn.textContent = '저장하고 완료하기';
  if(!r || r.error) return;

  state.me.survey = survey; state.me.survey_done = true;
  toast('저장했어요! 당일에 만나요 🧗');
  window.scrollTo(0,0);
  render();
}

/* ── 2. 카드 ── */
async function cardsView(){
  const d = await rpc('my_rounds', {p_token: token});
  const rounds = (d && d.rounds) || [];

  if(!rounds.length){
    return `<section><h2>설문 완료 ✓</h2>
      <p class="desc">당일 라운드가 시작되면 이 화면에 <b>상대 카드</b>가 나타나요.
      휴식 시간에 새로고침해서 확인해주세요.</p>
      <button class="ghost" onclick="render()">새로고침</button></section>`;
  }

  const cards = rounds.map(r => {
    const card = H.buildCard(state.me.survey, r.partner.survey);
    return `<div class="rcard">
      <div class="head"><span class="rno">라운드 ${r.round}</span>
        <span class="pname">${esc(r.partner.name)}</span></div>
      ${H.cardHTML(card, {mission: H.missionText(state.me.level, r.partner.level)})}
    </div>`;
  }).join('');

  return `<section><h2>이번 라운드 상대 🧗</h2>
    <p class="desc">공통점을 보고 대화를 시작해보세요. 아래로 갈수록 최근 라운드예요.</p>
    ${cards}
    <button class="ghost" onclick="render()">새로고침</button></section>`;
}

/* ── 3. 최종 선택 ── */
async function selectView(){
  const [d, mine] = await Promise.all([
    rpc('my_rounds', {p_token: token}),
    rpc('my_selection', {p_token: token})
  ]);
  const partners = ((d && d.rounds) || []).map(r => r.partner);
  const chosen = new Set(((mine && mine.chosen) || []));
  if(!partners.length) return '';

  return `<section><h2>오늘 어떠셨어요? 💌</h2>
    <p class="desc">다시 만나고 싶은 분을 골라주세요. <b>서로 선택한 경우에만</b> 연락처가 열려요.
      내 선택은 <b>상대에게 절대 보이지 않아요.</b></p>
    ${partners.map(p=>`
      <label class="pick">
        <input type="checkbox" class="sel" value="${p.id}" ${chosen.has(p.id)?'checked':''}>
        <span class="box">✓</span><span class="nm">${esc(p.name)}</span>
      </label>`).join('')}
    <p class="desc" style="margin:14px 0 12px">아무도 선택하지 않아도 괜찮아요.</p>
    <button onclick="submitSel(this)">선택 제출하기</button>
  </section>`;
}

async function submitSel(btn){
  const ids = [...document.querySelectorAll('.sel:checked')].map(e=>e.value);
  btn.disabled = true; btn.textContent = '제출 중…';
  const r = await rpc('submit_selection', {p_token: token, p_chosen: ids});
  btn.disabled = false; btn.textContent = '선택 제출하기';
  if(r && r.ok) toast('제출했어요. 결과는 곧 알려드릴게요');
  else if(r && r.error === 'closed') toast('선택 기간이 마감됐어요');
}

/* ── 4. 결과 ── */
async function resultView(){
  const d = await rpc('my_result', {p_token: token});
  if(!d || !d.ready) return '';
  const m = d.matches || [];

  if(!m.length){
    return `<section><h2>오늘 함께해주셔서 고마워요</h2>
      <p class="desc">이번엔 연결된 인연이 없었어요. 하지만 <b>클라이밍 한 판 잘 즐긴 하루</b>였길 바라요.
      다음 호비데이에서 또 만나요 🧗</p></section>`;
  }
  return `<section><h2>서로 통했어요! 🎉</h2>
    <p class="desc">두 분 다 서로를 선택하셨어요. 먼저 연락해보세요!</p>
    ${m.map(x=>`<div class="match"><p class="nm">${esc(x.name)}</p>
      <p class="ct">${esc(x.contact || '연락처 미등록 — 운영자 문의')}</p></div>`).join('')}
  </section>`;
}

boot();
</script>
</body>
</html>
