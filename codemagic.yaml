# Codemagic 빌드 설정 — 네이티브 앱을 클라우드에서 뽑는다.
#
# 윈도우에서는 iOS 를 빌드할 수 없어서(Xcode = macOS 전용) 클라우드를 쓴다.
# 안드로이드도 같은 곳에서 뽑아 파이프라인을 하나로 유지한다.
#
# 워크플로는 단계적으로 늘린다 — 한 번에 다 걸면 어디서 깨졌는지 못 찾는다:
#   1. android-debug   서명 없는 APK. 파이프라인이 뚫리는지 확인용   ← 지금
#   2. android-release 서명 + AAB (플레이스토어용)                   ← 다음
#   3. ios-release     서명 + IPA (앱스토어용)                       ← 그다음
#
# 모든 워크플로는 수동 시작이다 (triggering 없음 = 푸시해도 자동으로 안 돈다).
# 무료 500분/월 — 빌드 1회 10~15분.

workflows:
  android-debug:
    name: Android debug (unsigned)
    # 무료 플랜은 맥(M2)만 제공한다 — 안드로이드도 맥에서 문제없이 빌드된다
    instance_type: mac_mini_m2
    max_build_duration: 30
    # 파일은 레포 루트에 있어야 Codemagic 이 찾는다. 앱은 web/ 에 있다.
    working_directory: web
    environment:
      java: 21 # capacitor.build.gradle 의 VERSION_21 과 맞춘다
      node: 22
      vars:
        # 앱에 박히는 공개 키 — anon key 는 어차피 모든 번들에 들어가는
        # 공개값이라 여기 둬도 된다. 비밀키는 절대 여기 두지 않는다.
        NEXT_PUBLIC_SUPABASE_URL: "https://loigwslmwvltdurjttpe.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_zEXgjGowxniQ8rA1oqP-eg_Ilcswqa_"
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 웹 빌드 + 네이티브 반영 (BUILD_TARGET=native → 정적 내보내기)
        script: npm run sync
      - name: 안드로이드 빌드
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      # 경로 기준이 문서상 애매하다 (레포 루트 vs working_directory) —
      # 양쪽 다 걸어둔다. 중복 매칭은 무해하고, 안 걸리는 쪽만 무시된다.
      - web/android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.apk

  # ── 일회용: 서명 키(키스토어) 생성 ──
  # 로컬에 JDK 가 없어 빌드 머신에서 만든다. 한 번 돌리고 나면:
  #   1. Artifacts 의 keystore-and-password.zip 다운로드
  #   2. 압축 풀어 비밀번호 관리자에 백업 (⚠️ 이 키를 잃으면 앱 업데이트 불가)
  #   3. Codemagic > Team/앱 설정 > Code signing identities > Android keystores
  #      에 keystore 업로드 (비밀번호·alias 는 password.txt 내용)
  #      Reference name: hobiday_upload
  # 그 뒤로 이 워크플로는 다시 돌릴 일이 없다.
  make-keystore:
    name: Make upload keystore (run once)
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      java: 21
    scripts:
      - name: 키스토어 생성
        script: |
          PASS=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          keytool -genkeypair -v             -keystore hobiday-upload.keystore             -alias hobiday             -keyalg RSA -keysize 2048 -validity 10000             -storepass "$PASS" -keypass "$PASS"             -dname "CN=HobiDay, O=Senipick, C=KR"
          printf "keystore password: %s
key alias: hobiday
key password: %s
" "$PASS" "$PASS" > password.txt
          zip keystore-and-password.zip hobiday-upload.keystore password.txt
    artifacts:
      - keystore-and-password.zip

  # ── 안드로이드 릴리스 (서명된 AAB — 플레이스토어 업로드용) ──
  # 선행: make-keystore 로 만든 키가 Code signing identities 에
  # hobiday_upload 로 등록돼 있어야 한다.
  android-release:
    name: Android release (signed AAB)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: web
    environment:
      android_signing:
        - hobiday_upload
      java: 21
      node: 22
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://loigwslmwvltdurjttpe.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_zEXgjGowxniQ8rA1oqP-eg_Ilcswqa_"
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 웹 빌드 + 네이티브 반영
        script: npm run sync
      - name: 안드로이드 릴리스 빌드
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - web/android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.aab

