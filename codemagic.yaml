# Codemagic 빌드 설정 — 네이티브 앱을 클라우드에서 뽑는다.
#
# 윈도우에서는 iOS 를 빌드할 수 없어서(Xcode = macOS 전용) 클라우드를 쓴다.
# 안드로이드도 같은 곳에서 뽑아 파이프라인을 하나로 유지한다.
#
# 워크플로는 단계적으로 늘린다 — 한 번에 다 걸면 어디서 깨졌는지 못 찾는다:
#   1. android-debug   서명 없는 APK. 파이프라인이 뚫리는지 확인용   ← 지금
#   2. android-release 서명 + AAB (플레이스토어용)                   ← 다음
#   3. ios-release     서명 + IPA (앱스토어용)                       ← 그다음
#
# 모든 워크플로는 수동 시작이다 (triggering 없음 = 푸시해도 자동으로 안 돈다).
# 무료 500분/월 — 빌드 1회 10~15분.

workflows:
  android-debug:
    name: Android debug (unsigned)
    # 무료 플랜은 맥(M2)만 제공한다 — 안드로이드도 맥에서 문제없이 빌드된다
    instance_type: mac_mini_m2
    max_build_duration: 30
    # 파일은 레포 루트에 있어야 Codemagic 이 찾는다. 앱은 web/ 에 있다.
    working_directory: web
    environment:
      java: 21 # capacitor.build.gradle 의 VERSION_21 과 맞춘다
      node: 22
      vars:
        # 앱에 박히는 공개 키 — anon key 는 어차피 모든 번들에 들어가는
        # 공개값이라 여기 둬도 된다. 비밀키는 절대 여기 두지 않는다.
        NEXT_PUBLIC_SUPABASE_URL: "https://loigwslmwvltdurjttpe.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_zEXgjGowxniQ8rA1oqP-eg_Ilcswqa_"
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 웹 빌드 + 네이티브 반영 (BUILD_TARGET=native → 정적 내보내기)
        script: npm run sync
      - name: 안드로이드 빌드
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      # 경로 기준이 문서상 애매하다 (레포 루트 vs working_directory) —
      # 양쪽 다 걸어둔다. 중복 매칭은 무해하고, 안 걸리는 쪽만 무시된다.
      - web/android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.apk

  # ── 일회용: 서명 키(키스토어) 생성 ──
  # 로컬에 JDK 가 없어 빌드 머신에서 만든다. 한 번 돌리고 나면:
  #   1. Artifacts 의 keystore-and-password.zip 다운로드
  #   2. 압축 풀어 비밀번호 관리자에 백업 (⚠️ 이 키를 잃으면 앱 업데이트 불가)
  #   3. Codemagic > Team/앱 설정 > Code signing identities > Android keystores
  #      에 keystore 업로드 (비밀번호·alias 는 password.txt 내용)
  #      Reference name: hobiday_upload
  # 그 뒤로 이 워크플로는 다시 돌릴 일이 없다.
  make-keystore:
    name: Make upload keystore (run once)
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      java: 21
    scripts:
      - name: 키스토어 생성
        script: |
          PASS=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          keytool -genkeypair -v -keystore hobiday-upload.keystore -alias hobiday -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=HobiDay, O=Senipick, C=KR"
          echo "keystore password: $PASS" > password.txt
          echo "key alias: hobiday" >> password.txt
          echo "key password: $PASS" >> password.txt
          zip keystore-and-password.zip hobiday-upload.keystore password.txt
    artifacts:
      - keystore-and-password.zip

  # ── 안드로이드 릴리스 (서명된 AAB — 플레이스토어 업로드용) ──
  # 선행: make-keystore 로 만든 키가 Code signing identities 에
  # hobiday_upload 로 등록돼 있어야 한다.
  android-release:
    name: Android release (signed AAB)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: web
    environment:
      android_signing:
        - hobiday_upload
      java: 21
      node: 22
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://loigwslmwvltdurjttpe.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_zEXgjGowxniQ8rA1oqP-eg_Ilcswqa_"
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 웹 빌드 + 네이티브 반영
        script: npm run sync
      - name: 안드로이드 릴리스 빌드
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - web/android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.aab

  # ── iOS 릴리스 (서명된 IPA → TestFlight 자동 업로드) ──
  # 선행 조건 (Codemagic UI 에서):
  #   1. Apple Developer Portal 연동 — App Store Connect API 키를
  #      "hobiday_asc" 라는 이름으로 등록 (yaml 이 이 이름을 찾는다)
  #   2. App Store Connect 에 kr.hobiday.app 앱 레코드가 있어야
  #      TestFlight 업로드가 된다
  # 서명 인증서·프로비저닝은 Codemagic 이 API 키로 자동 생성한다 —
  # 맥 없이 iOS 를 빌드하는 핵심이 이 자동 서명이다.
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: web
    integrations:
      app_store_connect: hobiday_asc
    environment:
      groups:
        - appstore # CERTIFICATE_PRIVATE_KEY — Codemagic UI 에 등록한 인증서 열쇠
      java: 21
      node: 22
      vars:
        NEXT_PUBLIC_SUPABASE_URL: "https://loigwslmwvltdurjttpe.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_zEXgjGowxniQ8rA1oqP-eg_Ilcswqa_"
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 웹 빌드 + 네이티브 반영
        script: npm run sync
      - name: 빌드 번호 올리기 (TestFlight 는 같은 번호를 두 번 안 받는다)
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: 서명 파일 준비 (없으면 만든다)
        # 자동(ios_signing) 방식이 Distribution 인증서를 못 만들어서
        # 명시적으로 간다 — --create 가 인증서·프로파일을 생성한다.
        # 인증서 열쇠(CERTIFICATE_PRIVATE_KEY)를 우리가 쥐고 있어서
        # 다음 빌드부터는 같은 인증서를 재사용한다 (2장 제한에 안 걸림).
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "kr.hobiday.app" --type IOS_APP_STORE --create --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
      - name: 서명 프로파일 적용
        script: xcode-project use-profiles
      - name: IPA 빌드
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - web/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

