<!-- 하비데이 · 회원가입 확인 (인증번호 방식)
     Supabase Dashboard > Authentication > Emails > Confirm signup 에 붙여넣는다.

     링크({{ .ConfirmationURL }}) 대신 인증번호({{ .Token }})를 보여준다.
     자릿수는 프로젝트 설정(Email OTP Length = 6)을 따른다.
     링크는 메일 앱의 브라우저에서 열려 가입하던 화면과 끊기고,
     네이티브 앱에서는 앱 밖으로 나가버린다. 번호는 가입 화면에 그대로
     남아 입력만 하면 된다. 앱의 verifyOtp(type: 'signup') 와 짝이다.

     메일은 다크모드를 제대로 못 다루는 클라이언트가 많아 밝은 배경으로 간다.
     CSS 는 인라인으로만 — 지메일은 <style> 을 상당 부분 버린다. -->
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f2ef;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:36px 28px;">
        <tr>
          <td align="center" style="padding-bottom:4px;">
            <span style="font-size:19px;font-weight:800;color:#ff5a45;letter-spacing:0.5px;">HOBIDAY</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:26px;">
            <span style="font-size:12.5px;color:#8b857d;">취미로 시작해서, 사람으로 끝나는 하루</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:17px;font-weight:800;color:#1a1917;padding-bottom:10px;">
            가입 인증번호입니다
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:14px;line-height:1.7;color:#5f5a54;padding-bottom:22px;">
            가입 화면으로 돌아가서<br>
            아래 6자리 번호를 입력해주세요.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:22px;">
            <span style="display:inline-block;background:#f4f2ef;border-radius:12px;padding:16px 28px;font-size:32px;font-weight:800;letter-spacing:8px;color:#1a1917;">{{ .Token }}</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:12px;line-height:1.7;color:#8b857d;padding-bottom:4px;">
            번호는 잠시 뒤 만료돼요. 안 보이면 스팸함도 확인해주세요.
          </td>
        </tr>
        <tr>
          <td style="font-size:12px;line-height:1.7;color:#8b857d;border-top:1px solid #eae6e1;padding-top:18px;">
            가입한 적이 없다면 이 메일은 무시하셔도 괜찮아요.
            번호를 모르는 사람은 아무것도 할 수 없어요.
          </td>
        </tr>
      </table>
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
        <tr>
          <td align="center" style="font-size:11px;color:#a09a92;padding-top:18px;">
            하비데이 · HOBIDAY
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
