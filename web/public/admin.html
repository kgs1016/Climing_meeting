<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하비데이 운영 콘솔 — 공통점 카드 생성기</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f6f5f3; --panel:#fff; --line:#e2ded8; --line2:#f0ede9;
    --text:#1c1a18; --muted:#8a837a;
    --accent:#e04a35; --accent-bg:#fdeeeb;
    --mint:#1f8f70; --mint-bg:#e9f6f1;
    --male:#3b6fd4; --female:#c8447f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;padding:24px 16px 80px;
  }
  .wrap{max-width:1100px;margin:0 auto}

  header.top{margin-bottom:24px}
  .brand{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:1.5px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 6px}
  .lead{font-size:14px;color:var(--muted)}
  .lead code{background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:13px}

  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 24px}
  button{
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    padding:9px 16px;border-radius:9px;transition:.15s;
  }
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.06)}

  /* 입력 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .pcard h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
  .pill.m{background:var(--male)} .pill.f{background:var(--female)}
  .fld{margin-bottom:9px}
  .fld label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
  .fld input,.fld select{
    width:100%;font-family:inherit;font-size:13px;padding:7px 9px;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);
  }
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips label{
    font-size:12px;font-weight:500;padding:4px 9px;border:1px solid var(--line);
    border-radius:999px;cursor:pointer;color:var(--muted);background:#fff;user-select:none;
  }
  .chips input{display:none}
  .chips input:checked + span{color:#fff}
  .chips label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}

  /* 출력 */
  .roundhead{
    margin:34px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--text);
    display:flex;align-items:baseline;gap:10px;
  }
  .roundhead h2{font-size:19px;font-weight:800}
  .roundhead .pairs{font-size:12.5px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 14px;break-inside:avoid;
  }
  .card .to{
    font-size:12px;font-weight:700;color:var(--muted);
    padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--line2);
  }
  .card .to b{color:var(--text);font-size:14px}
  .card .to .arrow{color:var(--accent);margin:0 5px}
  .row{
    display:flex;align-items:flex-start;gap:8px;font-size:13.5px;
    padding:7px 10px;border-radius:8px;margin-bottom:6px;background:#faf9f7;
  }
  .row .tag{
    flex-shrink:0;font-size:10.5px;font-weight:800;padding:2px 7px;
    border-radius:5px;margin-top:2px;letter-spacing:.3px;
  }
  .row.t1{background:var(--accent-bg);border:1px solid #f6d6cf}
  .row.t1 .tag{background:var(--accent);color:#fff}
  .row.t2 .tag{background:#fff;color:var(--mint);border:1px solid var(--line)}
  .row.t3 .tag{background:#fff;color:var(--muted);border:1px solid var(--line)}
  .quote{
    border-left:3px solid var(--mint);background:var(--mint-bg);
    padding:8px 11px;border-radius:0 8px 8px 0;margin:9px 0 0;font-size:13px;
  }
  .quote small{display:block;color:var(--mint);font-size:11px;font-weight:700;margin-bottom:1px}
  .seed{
    margin-top:9px;padding:10px 12px;border-radius:8px;font-size:13.5px;
    background:#fff8e8;border:1px solid #f0e2c0;
  }
  .seed small{display:block;color:#a07a1e;font-size:11px;font-weight:800;margin-bottom:1px}
  .mission{
    margin-top:9px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;
    background:#eef3fb;border:1px solid #d5e0f2;color:#2c4c88;
  }
  .empty{color:var(--muted);font-size:13.5px;padding:10px;text-align:center}

  .note{
    background:#fff8e8;border:1px solid #f0e2c0;border-radius:10px;
    padding:12px 14px;font-size:13px;margin-bottom:20px;color:#6b5518;
  }

  @media print{
    body{background:#fff;padding:0}
    .bar,.inputsec,header.top .lead,.note{display:none}
    .cards{grid-template-columns:1fr 1fr}
    .card{border:1px solid #ccc}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <p class="brand">HOBIDAY</p>
    <h1>운영 콘솔 · 공통점 카드 생성기</h1>
    <p class="lead">
      3:3 참가자 6명의 설문을 넣으면 <b>라운드별 1:1 카드 18장</b>(3라운드 × 6명)을 자동 생성합니다.
      각 라운드 시작 5분 전, 해당 참가자에게 카톡으로 전달하세요.
    </p>
  </header>

  <div class="note">
    🔒 입력한 데이터는 <b>이 브라우저에만</b> 저장됩니다(localStorage). 서버로 전송되지 않아요.
    다른 기기에서 쓰려면 <code>JSON 내보내기</code>로 옮기세요.
  </div>

  <div class="bar">
    <button class="primary" onclick="generate()">카드 생성</button>
    <button onclick="fillSample()">샘플 채우기</button>
    <button onclick="exportJSON()">JSON 내보내기</button>
    <button onclick="document.getElementById('imp').click()">JSON 불러오기</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
    <button onclick="window.print()">인쇄</button>
    <button onclick="resetAll()">초기화</button>
  </div>

  <section class="inputsec">
    <div class="grid" id="inputs"></div>
  </section>

  <section id="output"></section>

</div>

<script>
/* ─────────── 스키마 ─────────── */
const LEVELS = ['초급','중급','상급'];
const LEVEL_DESC = {
  '초급':'빨강·주황 계열(초급)',
  '중급':'초록·파랑 계열(중급)',
  '상급':'보라 이상(상급)'
};
const MBTI = ['ISTJ','ISFJ','INFJ','INTJ','ISTP','ISFP','INFP','INTP',
              'ESTP','ESFP','ENFP','ENTP','ESTJ','ESFJ','ENFJ','ENTJ'];

// match: 'exact'(단일 일치→Tier1) | 'overlap'(다중 교집합→Tier2) | null
// diff: true면 값이 다를 때 Tier3 '궁금 포인트'로 노출
const FIELDS = [
  {key:'name',       label:'닉네임',            type:'text'},
  {key:'age',        label:'나이대',            type:'select', options:['20~24','25~29','30~34','35~39']},
  {key:'level',      label:'실력 (미션 기준)',  type:'select', options:LEVELS},
  {key:'homeGym',    label:'홈짐',              type:'text'},
  {key:'area',       label:'사는 동네',         type:'text',   match:'exact', card:v=>`같은 동네 · ${v}`},
  {key:'job',        label:'일 / 전공',         type:'text',   match:'exact', card:v=>`같은 분야 · ${v}`},
  {key:'mbti',       label:'MBTI',              type:'select', options:MBTI, match:'exact', card:v=>`둘 다 ${v}`,
                     diff:true, diffCard:(a,b)=>`MBTI가 정반대 — 나 ${a} / 상대 ${b}`},

  {key:'weekend',    label:'주말의 나는',       type:'multi',  match:'overlap',
   options:['집콕','나들이','운동','전시·문화','맛집투어','즉흥여행'],
   card:vs=>`주말 취향 겹침 · ${vs.join(' · ')}`},

  {key:'travel',     label:'여행 스타일',       type:'select', match:'exact',
   options:['분단위 계획형','즉흥형','맛집 중심','풍경 중심','액티비티 중심'],
   card:v=>`여행 스타일 같음 · ${v}`},

  {key:'food',       label:'못 참는 음식',      type:'multi',  match:'overlap',
   options:['마라','회·초밥','고기','빵·디저트','매운 것','국물+소주'],
   card:vs=>`둘 다 못 참음 · ${vs.join(' · ')}`},

  {key:'dateStyle',  label:'데이트는',          type:'select', match:'exact', options:['실내파','야외파'],
   card:v=>`둘 다 ${v}`, diff:true, diffCard:(a,b)=>`나는 ${a}, 상대는 ${b}`},

  {key:'afterClimb', label:'클라이밍 후 루틴',  type:'select', match:'exact', hero:true,
   options:['🍺 무조건 맥주','🥤 단백질 쉐이크','🍜 국밥·라멘 직행','🏃 바로 귀가','☕ 카페 수다'],
   card:v=>`둘 다 ${v}!`},

  {key:'gymItem',    label:'암장 필수템',       type:'select', match:'exact',
   options:['개인 초크','손톱깎이','테이핑','이어폰','맨몸이 장비'],
   card:v=>`둘 다 챙김 · ${v}`},

  {key:'topOut',     label:'완등하면 나는',     type:'select', match:'exact',
   options:['조용히 쿨하게 하강','포효','아래 보며 브이','영상부터 확인'],
   card:v=>`완등 세리머니 같음 · ${v}`,
   diff:true, diffCard:(a,b)=>`완등하면 나는 "${a}", 상대는 "${b}"`},

  {key:'stuck',      label:'안 풀리는 문제 앞', type:'select', match:'exact',
   options:['될 때까지 근성형','옆 문제로 도피','남의 베타 정찰','오늘은 아닌가 봐~'],
   card:v=>`막혔을 때 스타일 같음 · ${v}`,
   diff:true, diffCard:(a,b)=>`나는 "${a}", 상대는 "${b}" 🔍`},

  {key:'bestMoment', label:'클라이밍 최고 순간',type:'select', match:'exact',
   options:['완등 순간','베타 짜는 순간','다 같이 응원받을 때','새 문제 세팅된 날'],
   card:v=>`최고의 순간이 같음 · ${v}`},

  {key:'threeWords', label:'✍️ 나를 3단어로',   type:'text', free:'나를 3단어로'},
  {key:'intoLately', label:'✍️ 요즘 빠져있는 것',type:'text', free:'요즘 빠져있는 것'},
  {key:'climbStart', label:'✍️ 클라이밍 시작 계기',type:'text', free:'클라이밍 시작 계기'},
];

const SLOTS = [
  {id:'m0',g:'m',t:'남 1'},{id:'m1',g:'m',t:'남 2'},{id:'m2',g:'m',t:'남 3'},
  {id:'f0',g:'f',t:'여 1'},{id:'f1',g:'f',t:'여 2'},{id:'f2',g:'f',t:'여 3'},
];

const STORE = 'hobiday.participants';
let data = load();

/* ─────────── 저장/복원 ─────────── */
function load(){
  try{ const r = localStorage.getItem(STORE); if(r) return JSON.parse(r); }catch(e){}
  const d = {}; SLOTS.forEach(s => d[s.id] = {});
  return d;
}
function save(){ localStorage.setItem(STORE, JSON.stringify(data)); }

/* ─────────── 입력 UI ─────────── */
function renderInputs(){
  document.getElementById('inputs').innerHTML = SLOTS.map(slot => {
    const p = data[slot.id] || {};
    const fields = FIELDS.map(f => {
      const v = p[f.key];
      if(f.type === 'multi'){
        return `<div class="fld"><label>${f.label}</label><div class="chips">` +
          f.options.map(o => {
            const on = Array.isArray(v) && v.includes(o);
            return `<label><input type="checkbox" ${on?'checked':''}
              onchange="setMulti('${slot.id}','${f.key}','${o}',this.checked)"><span>${o}</span></label>`;
          }).join('') + `</div></div>`;
      }
      if(f.type === 'select'){
        return `<div class="fld"><label>${f.label}</label>
          <select onchange="setVal('${slot.id}','${f.key}',this.value)">
            <option value="">—</option>
            ${f.options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}
          </select></div>`;
      }
      return `<div class="fld"><label>${f.label}</label>
        <input value="${esc(v||'')}" oninput="setVal('${slot.id}','${f.key}',this.value)"></div>`;
    }).join('');
    return `<div class="pcard">
      <h3><span class="pill ${slot.g}">${slot.t}</span>${esc(p.name||'')}</h3>${fields}</div>`;
  }).join('');
}
function setVal(id,k,v){ (data[id] ||= {})[k] = v; save(); if(k==='name') renderInputs(); }
function setMulti(id,k,o,on){
  const p = (data[id] ||= {});
  const arr = new Set(p[k] || []);
  on ? arr.add(o) : arr.delete(o);
  p[k] = [...arr]; save();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ─────────── 카드 생성 ─────────── */
// 라운드 로빈: R2/R3/R4 (R1은 6인 그룹 워밍업이라 페어 없음)
function pairsForRound(r){       // r = 0,1,2  →  라운드 2,3,4
  return [0,1,2].map(i => ['m'+i, 'f'+((i+r)%3)]);
}

function missionLevel(a,b){
  const ia = LEVELS.indexOf(a.level), ib = LEVELS.indexOf(b.level);
  if(ia < 0 || ib < 0) return null;
  return LEVELS[Math.min(ia,ib)];
}

// me 기준으로 you를 소개하는 카드 데이터
function buildCard(me, you){
  const t1 = [], t2 = [], t3 = [];
  let heroMatch = null, topMatch = null;

  FIELDS.forEach(f => {
    const a = me[f.key], b = you[f.key];

    if(f.match === 'exact' && a && b && a === b){
      const line = f.card(a);
      if(f.hero){ heroMatch = {f, line}; }
      else { t1.push(line); }
      if(!topMatch) topMatch = f.key;
    }
    else if(f.match === 'overlap'){
      const inter = (a||[]).filter(x => (b||[]).includes(x));
      if(inter.length){
        t2.push({line: f.card(inter), hits: inter});
        if(!topMatch) topMatch = f.key;
      }
    }
    if(f.diff && a && b && a !== b && f.diffCard){
      t3.push(f.diffCard(a,b));
    }
  });

  if(heroMatch) t1.unshift(heroMatch.line);

  const frees = FIELDS.filter(f => f.free && you[f.key])
                      .map(f => ({label:f.free, text:you[f.key]}));

  return {t1, t2, t3, frees, seed: seedFor(me, you, heroMatch, topMatch, t2)};
}

function seedFor(me, you, hero, topKey, t2){
  if(hero) return '"라운드 끝나고 뭐 먹을지부터 정해야겠는데요?"';
  if(me.area && me.area === you.area) return `"${me.area} 사세요? 자주 가는 데 있어요?"`;
  if(me.travel && me.travel === you.travel) return '"최근 다녀온 여행 있어요? 저는…"';
  const w = t2.find(x => x.hits.includes('맛집투어'));
  if(w) return '"요즘 발견한 맛집 있어요?"';
  const f2 = t2.find(x => x.hits.length);
  if(f2) return `"${f2.hits[0]}" 얘기로 시작해보세요`;
  if(me.mbti && me.mbti === you.mbti) return `"${me.mbti}끼리는 통하는 게 있죠"`;
  if(you.climbStart) return '"클라이밍 어쩌다 시작했어요? 저는…"';
  return '"이 문제 같이 한번 붙어볼까요?"';
}

function generate(){
  const missing = SLOTS.filter(s => !(data[s.id] && data[s.id].name));
  const out = document.getElementById('output');
  if(missing.length){
    out.innerHTML = `<div class="empty">닉네임이 비어 있는 슬롯이 있어요 — ${missing.map(m=>m.t).join(', ')}</div>`;
    return;
  }

  out.innerHTML = [0,1,2].map(r => {
    const pairs = pairsForRound(r);
    const label = `라운드 ${r+2}`;
    const pairText = pairs.map(([a,b]) => `${data[a].name} × ${data[b].name}`).join('　·　');

    const cards = pairs.flatMap(([ma,fa]) => {
      const M = data[ma], F = data[fa];
      const lv = missionLevel(M,F);
      const mission = lv
        ? `🎯 함께 미션 · ${LEVEL_DESC[lv]} 이상 2문제 클리어`
        : `🎯 함께 미션 · 두 사람 모두 편한 난이도로 2문제`;
      return [[M,F],[F,M]].map(([me,you]) => renderCard(me, you, mission));
    });

    return `<div class="roundhead"><h2>${label}</h2><span class="pairs">${esc(pairText)}</span></div>
            <div class="cards">${cards.join('')}</div>`;
  }).join('');
}

function renderCard(me, you, mission){
  const c = buildCard(me, you);
  const rows =
    c.t1.map(l => `<div class="row t1"><span class="tag">일치</span><span>${esc(l)}</span></div>`).join('') +
    c.t2.map(o => `<div class="row t2"><span class="tag">겹침</span><span>${esc(o.line)}</span></div>`).join('') +
    c.t3.slice(0,2).map(l => `<div class="row t3"><span class="tag">궁금</span><span>${esc(l)}</span></div>`).join('');

  const frees = c.frees.map(f =>
    `<div class="quote"><small>상대가 직접 쓴 답 · ${esc(f.label)}</small>"${esc(f.text)}"</div>`).join('');

  return `<div class="card">
    <p class="to"><b>${esc(me.name)}</b> 님께<span class="arrow">→</span>다음 상대는 <b>${esc(you.name)}</b></p>
    ${rows || '<div class="empty">겹치는 항목이 없어요 — 클라이밍 얘기로 시작하세요</div>'}
    ${frees}
    <div class="seed"><small>💬 대화 씨앗</small>${esc(c.seed)}</div>
    <div class="mission">${esc(mission)}</div>
  </div>`;
}

/* ─────────── 유틸 ─────────── */
function fillSample(){
  data = {
    m0:{name:'지훈',age:'25~29',level:'중급',homeGym:'더클라임 연남',area:'연남동',job:'개발자',mbti:'ENFP',

function exportJSON(){
  const b = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'hobiday-participants.json'; a.click();
}
function importJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { try{ data = JSON.parse(rd.result); save(); renderInputs(); generate(); }
                      catch(err){ alert('JSON을 읽을 수 없어요'); } };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm('입력한 참가자 정보를 모두 지울까요?')) return;
  data = {}; SLOTS.forEach(s => data[s.id] = {});
  save(); renderInputs(); document.getElementById('output').innerHTML = '';
}
